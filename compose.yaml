services:
  app:
    build: .
    image: ${CATALOG_IMAGE:-catalog-boutique:local}
    env_file: ./deploy/production.env
    environment:
      Proxy__KnownProxies: ${PROXY_IP:-172.30.10.2}
    volumes:
      - protection-keys:/var/lib/catalog/keys
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [store]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  proxy:
    image: nginx:stable-alpine
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      STORE_HOST: ${STORE_HOST:?Configura STORE_HOST}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    restart: unless-stopped
    networks:
      store:
        ipv4_address: ${PROXY_IP:-172.30.10.2}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  protection-keys:
networks:
  store:
    ipam:
      config:
        - subnet: ${STORE_SUBNET:-172.30.10.0/24}
